version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Stockholm"

    target-branch: "develop"

    commit-message:
      prefix: "chore(deps)"

    labels:
      - "dependencies"

    open-pull-requests-limit: 2

    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"